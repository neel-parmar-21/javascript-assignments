</head>
<body>

        }

<!-- Q12 -->
<!DOCTYPE html>
<html>
<head>
    <title>Event Driven Programming</title>
</head>
<body>

    <button id="myBtn">Click Me</button>

    <p id="demo">Hello!</p>

    <script>
        document.getElementById("myBtn").onclick = function() {
            document.getElementById("demo").innerHTML = "Button was clicked!";
        };
    </script>

</body>
</html>
